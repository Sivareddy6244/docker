<?xml version="1.0" encoding="UTF-8"?>
<databaseChangeLog
        xmlns="http://www.liquibase.org/xml/ns/dbchangelog"
        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
        xsi:schemaLocation="
           http://www.liquibase.org/xml/ns/dbchangelog
           http://www.liquibase.org/xml/ns/dbchangelog/dbchangelog-4.23.xsd">

    <changeSet id="1" author="siva">
        <!-- Run the SQL file -->
        <sqlFile 
            path="create_customers.sql"
            relativeToChangelogFile="true"
            endDelimiter=";"
            splitStatements="true"/>
    </changeSet>

</databaseChangeLog>














$ liquibase update --report-enabled=true --report-path=./ --report-name=update-report.html




liquibase update --reports-open=true --reports-name=my_update_report.html


liquibase checks run --changelog-file=example-changelog.xml --reports-name=checks_run_report.html
















- liquibase update --reports-enabled=true --report-path=./liquibase-pro-report
    - liquibase tag # Tag AFTER the update has been applied
    
  artifacts:
    paths:
      - update-report.sql
      - liquibase-pro-report/
    when: always
    expire_in: 1 week
  tags:
    - cicd-k8s
